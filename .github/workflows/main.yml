---
name: Generate Test Report
# This workflow is triggered automatically and generates a test report
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  MEDNAFEN_HOME: ${{ github.workspace }}/emulators/mednafen/.mednafen
  SDL_VIDEODRIVER: dummy

jobs:
  build:
    name: Tests (${{ matrix.campaign }})
    runs-on: ubuntu-latest
    strategy:
      # One campaign failing must not cancel the others.
      fail-fast: false
      matrix:
        # Every campaign of Tests/makefile except fld: the container builds with MAKEFLAGS=-j 8, which runs shared.mk's
        # pre_build (it puts fld_game on the disc) and the disc image build at the same time, so the disc misses its files.
        campaign: [math, memory_simple, memory_tlsf, memory_cpus_simple, memory_cpus_tlsf, video, system, timer, timer_pal, event, datetime, cd, media, slave, scene, string, endian, vdp1, vdp2, input, sound, transform, tilemap, draw2d]
    container:
      image: willll/saturn-docker:gcc_14.2.0_vanilla

    steps:
      - name: Setup environment
        run: |
          apt-get update
          apt-get upgrade -y
          apt-get install -y unzip libsdl2-2.0-0 libflac-dev
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Setup iso2raw tool
        run: |
          cd $GITHUB_WORKSPACE
          ./tools/scripts/getiso2raw.sh v0.2.2
      - name: Build
        run: |
          cd $GITHUB_WORKSPACE/Tests
          make ${{ matrix.campaign }}
      - name: Install Mednafen
        run: |
          cd $GITHUB_WORKSPACE/emulators/mednafen
          curl -L -o Mednafen.Linux.zip https://github.com/willll/mednafenSSDev/releases/download/initial/Mednafen.Linux.zip
          unzip -o Mednafen.Linux.zip
          echo "$GITHUB_WORKSPACE/emulators/mednafen/" >> $GITHUB_PATH
      - name: Create Mednafen profile
        run: |
          mkdir -p $MEDNAFEN_HOME/firmware
      - name: Install BIOS
        run: |
          gdown 1miIZbAytFFRGlmL8H2gM8Hs__A3AC23P -O "$MEDNAFEN_HOME/firmware/mpr-17933.bin"
          gdown 1YvFP-7DCGq4AVd2Xo-HAaUQmikV6ufVT -O "$MEDNAFEN_HOME/firmware/sega_101.bin"
      - name: Run tests
        # Fails only on tests not listed under known_failures in Tests/campaigns.json.
        run: |
          cd $GITHUB_WORKSPACE/Tests
          bash $GITHUB_WORKSPACE/Tests/run_tests.bat mednafen ${{ matrix.campaign }}
      # Also when tests fail: the report job below reads every campaign's log.
      - name: Archive UT results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uts_${{ matrix.campaign }}.log
          path: Tests/uts_${{ matrix.campaign }}.log

  # One test report for all campaigns, after every campaign job (also when some failed)
  report:
    name: Test report
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Download every campaign's log
        uses: actions/download-artifact@v8
        with:
          pattern: uts_*.log
          path: logs
          merge-multiple: true
      - name: Convert test results
        run: |
          python3 tools/scripts/ctrf_converter.py logs/uts_*.log uts.json
      - name: Report Test Results
        uses: ctrf-io/github-test-reporter@v1
        with:
          report-path: './uts.json'
          summary-report: true
          failed-folded-report: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Archive report
        uses: actions/upload-artifact@v7
        with:
          name: uts.json
          path: uts.json
